<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="calculator">

    <div class="top">

        <h1>Scientific Calculator</h1>

        <button id="modeButton"
                onclick="toggleMode()">
            DEG
        </button>

    </div>


    <div class="display">

        <div id="history"></div>

        <input type="text"
               id="display"
               placeholder="0"
               readonly>

    </div>


    <div class="buttons">

        <button class="function"
                onclick="appendValue('sin(')">
            sin
        </button>

        <button class="function"
                onclick="appendValue('cos(')">
            cos
        </button>

        <button class="function"
                onclick="appendValue('tan(')">
            tan
        </button>

        <button class="function"
                onclick="appendValue('log(')">
            log
        </button>

        <button class="function"
                onclick="appendValue('ln(')">
            ln
        </button>


        <button class="function"
                onclick="appendValue('sqrt(')">
            √
        </button>

        <button class="function"
                onclick="appendValue('^')">
            xʸ
        </button>

        <button class="function"
                onclick="appendValue('!')">
            x!
        </button>

        <button class="function"
                onclick="appendValue('π')">
            π
        </button>

        <button class="function"
                onclick="appendValue('e')">
            e
        </button>


        <button class="clear"
                onclick="clearDisplay()">
            AC
        </button>

        <button onclick="backspace()">
            ⌫
        </button>

        <button onclick="appendValue('(')">
            (
        </button>

        <button onclick="appendValue(')')">
            )
        </button>

        <button class="operator"
                onclick="appendValue('÷')">
            ÷
        </button>


        <button onclick="appendValue('7')">
            7
        </button>

        <button onclick="appendValue('8')">
            8
        </button>

        <button onclick="appendValue('9')">
            9
        </button>

        <button class="operator"
                onclick="appendValue('×')">
            ×
        </button>

        <button class="function"
                onclick="appendValue('²')">
            x²
        </button>


        <button onclick="appendValue('4')">
            4
        </button>

        <button onclick="appendValue('5')">
            5
        </button>

        <button onclick="appendValue('6')">
            6
        </button>

        <button class="operator"
                onclick="appendValue('-')">
            −
        </button>

        <button class="function"
                onclick="appendValue('10^')">
            10ˣ
        </button>


        <button onclick="appendValue('1')">
            1
        </button>

        <button onclick="appendValue('2')">
            2
        </button>

        <button onclick="appendValue('3')">
            3
        </button>

        <button class="operator"
                onclick="appendValue('+')">
            +
        </button>

        <button class="equals"
                onclick="calculate()">
            =
        </button>


        <button onclick="appendValue('0')">
            0
        </button>

        <button onclick="appendValue('.')">
            .
        </button>

    </div>

    <div class="history-panel">

        <h3>Calculation History</h3>

        <div id="historyList"></div>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
